# ========================================
# tmux — development configuration (macOS + Linux)
# Keyboard-focused · Ghostty · Catppuccin Mocha
# Lives at ~/.config/tmux/tmux.conf (linked from ~/dotfiles/home/tmux).
# ========================================

# Keep the default tmux prefix: Ctrl+B
set -g prefix C-b

# Mouse support for pane selection, resizing and scrolling.
# Toggle temporarily with: tmux set -g mouse on/off
set -g mouse on

# Scrollback history per pane
set -g history-limit 30000

# Start window and pane indices at 1
set -g base-index 1
setw -g pane-base-index 1

# Close gaps in window indices
set -g renumber-windows on

# Preserve manually assigned window names
setw -g automatic-rename off
set -g allow-rename off

# Preserve the terminal capability configuration that works on your Mac.
# Do not change this just to enable Vim keybindings.
set -g default-terminal "tmux-256color"

# True-color and styled/colored underline (undercurl) support from Ghostty
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",xterm-ghostty:usstyle"

# Report focus changes to applications that support them
set -g focus-events on

# Let programs send escape sequences to Ghostty, also from background panes:
# Claude Code and Codex use this for desktop notifications.
set -g allow-passthrough all

# Minimize Esc delay for Neovim without making it zero
set -sg escape-time 25

# ========================================
# tmux scrollback: Vi keys + system clipboard
# ========================================

# These keys apply ONLY after Ctrl+B, then [ (tmux copy mode).
# Shell, Neovim, Claude, and Codex keymaps are unaffected.
setw -g mode-keys vi

# Copies reach the system clipboard through Ghostty via OSC 52 (works on
# macOS, Linux and over SSH). Applications may write the clipboard but not
# read tmux's buffers.
set -s set-clipboard external
set -as terminal-features ",xterm-ghostty:clipboard"

# v starts a selection; y or Enter copies to both the tmux paste
# buffer and the system clipboard, then exits copy mode.
bind-key -T copy-mode-vi v \
  send-keys -X begin-selection

bind-key -T copy-mode-vi y \
  send-keys -X copy-selection-and-cancel

bind-key -T copy-mode-vi Enter \
  send-keys -X copy-selection-and-cancel

# No mouse-drag copy bindings: this is the keyboard-focused variant.
# Paste tmux's buffer: Ctrl+B, then ]
# Paste the system clipboard into Ghostty: Cmd+V (Linux: Ctrl+Shift+V)

# ========================================
# Appearance — Catppuccin Mocha (matches Ghostty and Neovim)
# ========================================

# Pane contents keep Ghostty's/Neovim's own colors.
set -gw window-style "fg=default,bg=default"
set -gw window-active-style "fg=default,bg=default"

set -g status on
set -g status-position bottom
set -g status-style "bg=#181825,fg=#cdd6f4"

# Update status commands every 15 seconds
set -g status-interval 15

# Left: session name
set -g status-left-length 40
set -g status-left "#[fg=#cba6f7,bold] #S #[default]"

# Right: load/battery helper (~/.local/bin/tmux-sysinfo) and a clock
set -g status-right-length 65
set -g status-right "#[fg=#9399b2]#(~/.local/bin/tmux-sysinfo) │ %a %H:%M "

# Window tabs
set -g window-status-separator ""
set -g window-status-format "#[fg=#a6adc8,bg=#181825] #I:#W "
set -g window-status-current-format "#[fg=#1e1e2e,bg=#89b4fa,bold] #I:#W #[default]"

# Pane borders
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"

# Copy mode / selection, command prompt and messages
set -g mode-style "bg=#45475a,fg=#cdd6f4"
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#cdd6f4"

# ========================================
# Window and pane names / borders
# ========================================

# Prevent applications changing pane titles
set -g allow-set-title off

# Ghostty tab/window title shows the tmux session and window, e.g. "myproject · claude".
set -g set-titles on
set -g set-titles-string "#S · #W"
set -as terminal-features ",xterm-ghostty:title"

# Show pane titles above panes
set -g pane-border-status top
set -g pane-border-format ' #{pane_index}: #{pane_title} '

# ========================================
# Everyday bindings
# ========================================

# New tmux windows start in the current pane's directory
bind-key c new-window -c "#{pane_current_path}"

# Ctrl+B, then r: reload this file without restarting sessions
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "tmux reloaded"

# ========================================
# Seamless Neovim split / tmux pane navigation (smart-splits.nvim)
# ========================================

# Ctrl+h/j/k/l moves between tmux panes. In a pane running Neovim, the key
# is passed through and smart-splits hands off to tmux at Neovim's edge.
# @pane-is-vim is set by smart-splits' tmux backend while Neovim owns the pane.
# Plain select-pane wraps at the window edge, matching move.at_edge = "wrap".
bind-key -n C-h if -F '#{@pane-is-vim}' { send-keys C-h } { select-pane -L }
bind-key -n C-j if -F '#{@pane-is-vim}' { send-keys C-j } { select-pane -D }
bind-key -n C-k if -F '#{@pane-is-vim}' { send-keys C-k } { select-pane -U }
bind-key -n C-l if -F '#{@pane-is-vim}' { send-keys C-l } { select-pane -R }

bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R

# Ctrl+L is taken above; Ctrl+B, then Ctrl+L clears the shell screen instead.
bind-key C-l send-keys C-l
